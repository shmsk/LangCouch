name: Host smoke tests

# Installs Hermes Agent and OpenClaw on a throwaway runner (never on a dev
# machine) and checks the LangCouch adapters end to end:
#   fake-model jobs: the plugin loads, the hook fires, and the <langcouch>
#     block reaches the model request. No API key needed.
#   live jobs: a real cheap model on OpenRouter actually weaves words.
#     Never on pull requests: they need the OPENROUTER_API_KEY secret.
# Runs when adapter code changes, weekly (to catch a host release that breaks
# a plugin), and by hand from the Actions tab.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main, hosts-smoke]
    paths:
      - "adapters/**"
      - "src/**"
      - "scripts/**"
      - "tests/smoke/**"
      - ".github/workflows/hosts-smoke.yml"
  pull_request:
    paths:
      - "adapters/**"
      - "src/**"
      - "scripts/**"
      - "tests/smoke/**"
      - ".github/workflows/hosts-smoke.yml"

env:
  HERMES_VERSION: "0.19.0"
  OPENCLAW_VERSION: "2026.9.7"
  CODEX_VERSION: "0.159.2"
  OPENCODE_VERSION: "1.18.33"
  # opencode: skip ~/.claude context and self-update on the runner
  OPENCODE_DISABLE_CLAUDE_CODE: "1"
  OPENCODE_DISABLE_AUTOUPDATE: "1"
  FAKE_LLM_PORT: "4010"
  LIVE_PROMPT: "In four or five plain sentences, explain why morning daylight helps people wake up."

jobs:
  hermes-fake:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v6
      - name: Isolated dirs
        run: |
          echo "LANGCOUCH_DIR=$RUNNER_TEMP/langcouch" >> "$GITHUB_ENV"
          echo "HERMES_HOME=$RUNNER_TEMP/hermes" >> "$GITHUB_ENV"
          echo "FAKE_LLM_LOG=$RUNNER_TEMP/fake-llm.jsonl" >> "$GITHUB_ENV"
      - run: bun install
      - name: Install Hermes Agent
        run: |
          uv tool install --python 3.12 "hermes-agent==$HERMES_VERSION"
          uv tool dir --bin >> "$GITHUB_PATH"
      - run: hermes --version
      - name: Install the LangCouch plugin
        run: |
          bun src/cli.ts init && bun src/cli.ts level 5
          bun src/cli.ts install hermes
      - name: Point Hermes at the fake model, enable the plugin
        run: |
          cat > "$HERMES_HOME/config.yaml" <<EOF
          model:
            provider: custom
            base_url: http://127.0.0.1:$FAKE_LLM_PORT/v1
            default: fake-model
            context_length: 128000
          plugins:
            enabled: [langcouch]
          EOF
      - name: Start the fake model
        run: |
          bun tests/smoke/fake-llm.ts > "$RUNNER_TEMP/fake-llm.out" 2>&1 &
          for i in $(seq 1 30); do curl -sf "http://127.0.0.1:$FAKE_LLM_PORT/v1/models" >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/fake-llm.out"; exit 1
      - name: Plugin registered its hook and command
        run: |
          HERMES_PLUGINS_DEBUG=1 hermes plugins list 2>&1 | tee "$RUNNER_TEMP/plugins.txt"
          PY="$(uv tool dir)/hermes-agent/bin/python"; [ -x "$PY" ] || PY="$(uv tool dir)/hermes-agent/Scripts/python.exe"
          "$PY" - <<'EOF'
          from hermes_cli.plugins import discover_plugins, get_plugin_manager, get_plugin_commands
          discover_plugins()
          hooks, cmds = list(get_plugin_manager()._hooks), list(get_plugin_commands())
          print("hooks:", hooks, "commands:", cmds)
          assert "pre_llm_call" in hooks, "pre_llm_call not registered"
          assert "langcouch" in cmds, "/langcouch not registered"
          EOF
      - name: One turn against the fake model
        run: |
          hermes -z "hello from CI" > "$RUNNER_TEMP/reply.txt"; code=$?
          echo "exit $code, reply: $(cat "$RUNNER_TEMP/reply.txt")"; exit $code
      - name: The <langcouch> block reached the model
        run: bun tests/smoke/assert-woven.ts request "$FAKE_LLM_LOG"
      - name: Logs on failure
        if: failure()
        run: |
          cat "$RUNNER_TEMP/fake-llm.out" || true
          tail -n 200 "$HERMES_HOME"/logs/*.log 2>/dev/null || true

  openclaw-fake:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Isolated dirs
        run: |
          echo "LANGCOUCH_DIR=$RUNNER_TEMP/langcouch" >> "$GITHUB_ENV"
          echo "OPENCLAW_HOME=$RUNNER_TEMP/ochome" >> "$GITHUB_ENV"
          echo "FAKE_LLM_LOG=$RUNNER_TEMP/fake-llm.jsonl" >> "$GITHUB_ENV"
      - run: bun install
      - name: Install OpenClaw
        run: npm install -g "openclaw@$OPENCLAW_VERSION" && openclaw --version
      - name: Install the LangCouch plugin
        run: |
          bun src/cli.ts init && bun src/cli.ts level 5
          bun src/cli.ts install openclaw
      - name: Point OpenClaw at the fake model
        run: |
          mkdir -p "$OPENCLAW_HOME/.openclaw"
          cat > "$OPENCLAW_HOME/.openclaw/openclaw.json" <<EOF
          {
            "models": { "mode": "merge", "providers": { "fake": {
              "baseUrl": "http://127.0.0.1:$FAKE_LLM_PORT/v1",
              "apiKey": "sk-fake",
              "api": "openai-completions",
              "models": [{ "id": "fake-model", "name": "Fake", "reasoning": false, "input": ["text"],
                "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
                "contextWindow": 32000, "maxTokens": 4096 }]
            } } },
            "agents": { "defaults": { "model": { "primary": "fake/fake-model" } } }
          }
          EOF
      - name: Link, allow, enable (the commands the installer prints)
        run: |
          openclaw plugins install --link "$LANGCOUCH_DIR/openclaw-plugin" --force --accept-capabilities
          openclaw config set plugins.entries.langcouch.hooks.allowConversationAccess true --strict-json
          openclaw plugins enable langcouch
      - name: Plugin registered its hook
        run: |
          openclaw plugins inspect langcouch --runtime --json > "$RUNNER_TEMP/inspect.json"; cat "$RUNNER_TEMP/inspect.json"
          grep -q before_prompt_build "$RUNNER_TEMP/inspect.json"
      - name: Start the fake model
        run: |
          bun tests/smoke/fake-llm.ts > "$RUNNER_TEMP/fake-llm.out" 2>&1 &
          for i in $(seq 1 30); do curl -sf "http://127.0.0.1:$FAKE_LLM_PORT/v1/models" >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/fake-llm.out"; exit 1
      - name: One turn against the fake model
        run: openclaw agent --local --agent main --message "hello from CI" --timeout 120
      - name: The <langcouch> block reached the model
        run: bun tests/smoke/assert-woven.ts request "$FAKE_LLM_LOG"
      - name: Logs on failure
        if: failure()
        run: |
          cat "$RUNNER_TEMP/fake-llm.out" || true
          openclaw plugins doctor --json || true

  codex-fake:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Isolated dirs
        run: |
          echo "LANGCOUCH_DIR=$RUNNER_TEMP/langcouch" >> "$GITHUB_ENV"
          echo "CODEX_HOME=$RUNNER_TEMP/codex" >> "$GITHUB_ENV"
          echo "FAKE_LLM_LOG=$RUNNER_TEMP/fake-llm.jsonl" >> "$GITHUB_ENV"
      - run: bun install
      - name: Install Codex
        run: npm install -g "@openai/codex@$CODEX_VERSION" && codex --version
      - name: Install the LangCouch hook
        run: |
          bun src/cli.ts init && bun src/cli.ts level 5
          bun src/cli.ts install codex --scope user
          cat "$CODEX_HOME/hooks.json"
      - name: Point Codex at the fake model
        run: |
          cat > "$CODEX_HOME/config.toml" <<EOF
          model_provider = "fake"
          model = "fake-model"
          [model_providers.fake]
          name = "fake"
          base_url = "http://127.0.0.1:$FAKE_LLM_PORT/v1"
          wire_api = "responses"
          env_key = "FAKE_API_KEY"
          EOF
      - name: Start the fake model
        run: |
          bun tests/smoke/fake-llm.ts > "$RUNNER_TEMP/fake-llm.out" 2>&1 &
          for i in $(seq 1 30); do curl -sf "http://127.0.0.1:$FAKE_LLM_PORT/v1/models" >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/fake-llm.out"; exit 1
      - name: One turn against the fake model
        # --dangerously-bypass-hook-trust stands in for the one-time /hooks review a user does
        run: FAKE_API_KEY=x codex exec --skip-git-repo-check --ephemeral --dangerously-bypass-hook-trust -s read-only "hello from CI"
      - name: The <langcouch> block reached the model
        run: bun tests/smoke/assert-woven.ts request "$FAKE_LLM_LOG"
      - name: Logs on failure
        if: failure()
        run: cat "$RUNNER_TEMP/fake-llm.out" || true

  opencode-fake:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      OPENCODE_DISABLE_MODELS_FETCH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Isolated dirs
        run: |
          echo "LANGCOUCH_DIR=$RUNNER_TEMP/langcouch" >> "$GITHUB_ENV"
          echo "FAKE_LLM_LOG=$RUNNER_TEMP/fake-llm.jsonl" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/install" "$RUNNER_TEMP/work"
      - run: bun install
      - name: Install opencode
        run: npm install -g "opencode-ai@$OPENCODE_VERSION" && opencode --version
      - name: Install the LangCouch plugin (user scope, ~/.config/opencode/plugin)
        # installed from a scratch dir: the installer also writes an AGENTS.md
        # fallback into the cwd, and the turn below must exercise the plugin alone
        working-directory: ${{ runner.temp }}/install
        run: |
          bun "$GITHUB_WORKSPACE/src/cli.ts" init && bun "$GITHUB_WORKSPACE/src/cli.ts" level 5
          bun "$GITHUB_WORKSPACE/src/cli.ts" install opencode --scope user
          ls -la ~/.config/opencode/plugin
      - name: Point opencode at the fake model
        run: |
          cat > ~/.config/opencode/opencode.json <<EOF
          {
            "\$schema": "https://opencode.ai/config.json",
            "share": "disabled",
            "autoupdate": false,
            "provider": { "fake": {
              "npm": "@ai-sdk/openai-compatible",
              "name": "Fake",
              "options": { "baseURL": "http://127.0.0.1:$FAKE_LLM_PORT/v1", "apiKey": "x" },
              "models": { "fake-model": { "name": "Fake Model" } }
            } }
          }
          EOF
      - name: Start the fake model
        run: |
          bun tests/smoke/fake-llm.ts > "$RUNNER_TEMP/fake-llm.out" 2>&1 &
          for i in $(seq 1 30); do curl -sf "http://127.0.0.1:$FAKE_LLM_PORT/v1/models" >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/fake-llm.out"; exit 1
      - name: One turn against the fake model
        working-directory: ${{ runner.temp }}/work
        run: opencode run -m fake/fake-model "hello from CI"
      - name: The <langcouch> block reached the model
        run: bun tests/smoke/assert-woven.ts request "$FAKE_LLM_LOG"
      - name: Logs on failure
        if: failure()
        run: |
          cat "$RUNNER_TEMP/fake-llm.out" || true
          tail -n 200 ~/.local/share/opencode/log/*.log 2>/dev/null || true

  live:
    needs: [hermes-fake, openclaw-fake, codex-fake, opencode-fake]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        host: [hermes, openclaw, codex, opencode]
        model: ["deepseek/deepseek-v4.1-flash", "z-ai/glm-5.3-flash"]
    env:
      MODEL: ${{ matrix.model }}
    # The key is given to the one step that calls the model, never to install
    # steps: package install scripts must not see it. It is never written to disk.
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v6
        if: matrix.host == 'hermes'
      - uses: actions/setup-node@v4
        if: matrix.host == 'openclaw' || matrix.host == 'codex' || matrix.host == 'opencode'
        with:
          node-version: 24
      - name: Isolated dirs
        run: |
          echo "LANGCOUCH_DIR=$RUNNER_TEMP/langcouch" >> "$GITHUB_ENV"
          echo "HERMES_HOME=$RUNNER_TEMP/hermes" >> "$GITHUB_ENV"
          echo "OPENCLAW_HOME=$RUNNER_TEMP/ochome" >> "$GITHUB_ENV"
          echo "CODEX_HOME=$RUNNER_TEMP/codex" >> "$GITHUB_ENV"
      - run: bun install && bun src/cli.ts init && bun src/cli.ts lang es && bun src/cli.ts level 5
      - name: Hermes setup
        if: matrix.host == 'hermes'
        run: |
          uv tool install --python 3.12 "hermes-agent==$HERMES_VERSION"
          bun src/cli.ts install hermes
          printf 'plugins:\n  enabled: [langcouch]\n' > "$HERMES_HOME/config.yaml"
      - name: OpenClaw setup
        if: matrix.host == 'openclaw'
        run: |
          npm install -g "openclaw@$OPENCLAW_VERSION"
          bun src/cli.ts install openclaw
          mkdir -p "$OPENCLAW_HOME/.openclaw"
          printf '{"agents":{"defaults":{"model":{"primary":"openrouter/%s"}}}}\n' "$MODEL" > "$OPENCLAW_HOME/.openclaw/openclaw.json"
          openclaw plugins install --link "$LANGCOUCH_DIR/openclaw-plugin" --force --accept-capabilities
          openclaw config set plugins.entries.langcouch.hooks.allowConversationAccess true --strict-json
          openclaw plugins enable langcouch
      - name: Codex setup
        if: matrix.host == 'codex'
        run: |
          npm install -g "@openai/codex@$CODEX_VERSION"
          bun src/cli.ts install codex --scope user
          cat > "$CODEX_HOME/config.toml" <<EOF
          model_provider = "openrouter"
          model = "$MODEL"
          [model_providers.openrouter]
          name = "OpenRouter"
          base_url = "https://openrouter.ai/api/v1"
          wire_api = "responses"
          env_key = "OPENROUTER_API_KEY"
          EOF
      - name: opencode setup
        if: matrix.host == 'opencode'
        run: |
          npm install -g "opencode-ai@$OPENCODE_VERSION"
          mkdir -p "$RUNNER_TEMP/install" "$RUNNER_TEMP/work"
          (cd "$RUNNER_TEMP/install" && bun "$GITHUB_WORKSPACE/src/cli.ts" install opencode --scope user)
          printf '{"share":"disabled","autoupdate":false,"provider":{"openrouter":{"models":{"%s":{}}}}}\n' "$MODEL" > ~/.config/opencode/opencode.json
      - name: A real model weaves (one retry, replies vary)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$OPENROUTER_API_KEY" || { echo "OPENROUTER_API_KEY secret is not set"; exit 1; }
          for attempt in 1 2; do
            case "${{ matrix.host }}" in
              hermes) hermes -z "$LIVE_PROMPT" --provider openrouter -m "$MODEL" > reply.txt || true ;;
              openclaw) openclaw agent --local --agent main --message "$LIVE_PROMPT" --timeout 180 > reply.txt || true ;;
              opencode) (cd "$RUNNER_TEMP/work" && opencode run -m "openrouter/$MODEL" "$LIVE_PROMPT") > reply.txt || true ;;
              codex) codex exec --skip-git-repo-check --ephemeral --dangerously-bypass-hook-trust -s read-only -o reply.txt "$LIVE_PROMPT" > /dev/null || true ;;
            esac
            if bun tests/smoke/assert-woven.ts reply reply.txt es; then
              { echo "### ${{ matrix.host }} × $MODEL"; echo; cat reply.txt; } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $attempt did not weave"
          done
          exit 1
